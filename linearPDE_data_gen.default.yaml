# Default configuration for linearPDE_data_gen.py
# Usage:
#   .venv/bin/python linearPDE_data_gen.py --config linearPDE_data_gen.default.yaml
#
# Any CLI flag can override a YAML value, for example:
#   .venv/bin/python linearPDE_data_gen.py \
#       --config linearPDE_data_gen.default.yaml \
#       --num-traj 300 \
#       --ctrl-mode lqr
#   .venv/bin/python linearPDE_data_gen.py \
#       --config linearPDE_data_gen.default.yaml \
#       --dataset-modes zero ctrl

env_id: wave
num_traj: 5
ctrl_mode: lqr
dataset_modes: [zero, random, ctrl]
# Example reduced test run:
# dataset_modes: [zero, random]
init_seed: 123
noise_seed: 10000
sample_check_count: 5
sample_check_seed: 42
fill_nan: false
output_dir: data_linearPDE/

env_kwargs:
  n_state: 200
  n_observation: 200
  n_action: 8
  n_steps: 200
  process_noise_cov: 0.0
  sensor_noise_cov: 1.0e-8
  action_limit: 0.5

