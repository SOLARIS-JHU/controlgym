#   cycles_range: [1, 3]
#   amp_range: [10, 20]
#   num_modes: 4
#   zero_mean: true
#   per_dim: true

random_signal_kwargs:
  signal_mode: env
  cycles_range: [10, 20]
  amp_range: [10, 20]
  num_modes: 4
  zero_mean: true
  per_dim: true
